# Copilot Auto Review 配置文件

# 此文件包含 GitHub Actions workflow 的所有可配置项
# 修改此文件后，需要在 .github/workflows/copilot-review.yml 中相应更新

## 基本配置

### 触发条件
- **PR 触发分支**: main, master, develop
- **Push 触发分支**: main, master
- **支持手动触发**: 是

## 审查配置

### 审查详细程度
# 可选值: basic, detailed, comprehensive
REVIEW_DETAIL_LEVEL=detailed

### 功能开关

#### 启用安全检查
# 检查安全漏洞、SQL 注入、XSS、敏感信息泄露等
ENABLE_SECURITY_CHECK=true

#### 启用性能分析
# 检查性能问题、算法复杂度、资源使用等
ENABLE_PERFORMANCE_CHECK=true

#### 启用代码质量检查
# 检查代码可读性、可维护性、命名规范等
ENABLE_QUALITY_CHECK=true

#### 启用最佳实践检查
# 检查设计模式、代码风格、编程惯例等
ENABLE_BEST_PRACTICES=true

### 文件过滤

#### 审查的文件类型
# 逗号分隔的文件扩展名列表，留空表示审查所有类型
FILE_EXTENSIONS=*.py,*.js,*.ts,*.java,*.go,*.rb

#### 触发审查的最小文件变更数
# 0 表示无论多少变更都触发审查
MIN_CHANGED_FILES=0

### 附加功能

#### 自动添加标签
# 在 PR 中自动添加 'copilot-review' 标签
ADD_REVIEW_LABEL=true

#### 自定义审查消息
# 在审查请求中添加自定义消息（留空使用默认模板）
CUSTOM_REVIEW_MESSAGE=

## 手动触发选项

### 可用的审查范围
# - comprehensive: 全面审查
# - security-only: 仅安全审查
# - performance-only: 仅性能审查
# - code-quality: 仅代码质量审查

### 默认审查范围
DEFAULT_REVIEW_SCOPE=comprehensive

### 默认目标分支
DEFAULT_TARGET_BRANCH=main

## 高级配置

### GitHub API 配置
# 使用默认的 GITHUB_TOKEN，如需自定义 token，可在仓库 Secrets 中配置

### 审查结果处理
# 是否在审查后自动关闭 issue（main 分支审查）
AUTO_CLOSE_REVIEW_ISSUE=false

### 审查历史保留
# 保留多少天的审查 issue（0 表示永久保留）
REVIEW_HISTORY_RETENTION_DAYS=0

### 通知设置
# 是否在审查完成后发送通知（需要配置 webhook）
ENABLE_NOTIFICATIONS=false

## 自定义审查提示词模板

### PR 审查模板
PR_REVIEW_TEMPLATE="
@copilot Please review this PR thoroughly.

Focus areas:
- Security vulnerabilities
- Performance bottlenecks  
- Code quality issues
- Best practices violations

Provide specific suggestions for improvements.
"

### Main 分支审查模板
MAIN_BRANCH_REVIEW_TEMPLATE="
@copilot This commit was pushed to the main branch.

Please review for:
- Any issues that might have been missed in PR review
- Production-ready code quality
- Potential runtime issues
- Documentation completeness
"

### 手动审查模板
MANUAL_REVIEW_TEMPLATE="
@copilot Manual review requested.

Please provide a comprehensive analysis of the codebase.
"

---

## 使用说明

### 方式 1: 修改 workflow 文件中的 env 部分
编辑 `.github/workflows/copilot-review.yml` 文件中的 `env:` 部分

### 方式 2: 使用仓库 Variables（推荐）
1. 进入仓库 Settings → Secrets and variables → Actions → Variables
2. 添加对应的变量名和值
3. 在 workflow 中使用 `${{ vars.VARIABLE_NAME }}`

### 方式 3: 使用 GitHub Environments
为不同环境（开发、生产）设置不同的配置

---

## 示例配置场景

### 场景 1: 仅关注安全问题
```
ENABLE_SECURITY_CHECK=true
ENABLE_PERFORMANCE_CHECK=false
ENABLE_QUALITY_CHECK=false
ENABLE_BEST_PRACTICES=false
```

### 场景 2: 生产环境严格审查
```
REVIEW_DETAIL_LEVEL=comprehensive
ENABLE_SECURITY_CHECK=true
ENABLE_PERFORMANCE_CHECK=true
ENABLE_QUALITY_CHECK=true
ENABLE_BEST_PRACTICES=true
MIN_CHANGED_FILES=0
```

### 场景 3: 开发环境快速反馈
```
REVIEW_DETAIL_LEVEL=basic
MIN_CHANGED_FILES=5
ADD_REVIEW_LABEL=false
```

### 场景 4: 仅审查关键文件类型
```
FILE_EXTENSIONS=*.py,*.js,*.ts
MIN_CHANGED_FILES=1
```

---

## 故障排除

### 问题 1: Workflow 没有触发
检查：
- 分支名是否匹配触发条件
- Workflow 文件语法是否正确
- 仓库是否启用了 Actions

### 问题 2: 无法添加评论
检查：
- GITHUB_TOKEN 是否有足够的权限
- permissions 配置是否正确

### 问题 3: Copilot 没有响应
注意：
- 确保 GitHub Copilot 订阅已激活
- @copilot 只在 GitHub.com 的 PR/Issue 中有效
- 可能需要一些时间才能得到响应

