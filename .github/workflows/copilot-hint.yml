name: Copilot Auto Review

on:
  pull_request:
    types: [opened]

permissions:
  pull-requests: write

jobs:
  auto-review:
    runs-on: ubuntu-latest

    steps:
      - name: Ask Copilot to review
        env:
          GH_TOKEN: ${{ secrets.COPILOT_TRIGGER_TOKEN }}
        run: |
          gh pr comment ${{ github.event.pull_request.number }} \
            --body "@copilot review"